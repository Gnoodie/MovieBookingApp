# .swiftlint.yml
disabled_rules:
  - trailing_whitespace  # Gây conflict với SwiftFormat

opt_in_rules:
  - empty_count          # Dùng isEmpty thay vì count == 0
  - explicit_init        # Không cần explicit init()
  - closure_spacing      # Space trong closure
  - collection_alignment # Align collection literals
  - operator_usage_whitespace

included:
  - App
  - Shared
  - AppIntentsExtension

excluded:
  - Pods
  - .build
  - Tests  # Relax rules trong test files

# Cấu hình giới hạn
line_length:
  warning: 120
  error: 150
file_length:
  warning: 400
  error: 600
function_body_length:
  warning: 50
  error: 100
type_body_length:
  warning: 200
  error: 350
identifier_name:
  min_length: 2

# Custom rules
custom_rules:
  force_unwrap_banned:
    name: "Force Unwrap Banned"
    regex: '(?<!\btest)\b[A-Za-z0-9_]+\!(?!\=)'
    message: "Do not force unwrap. Handle optionals safely."
    severity: error
